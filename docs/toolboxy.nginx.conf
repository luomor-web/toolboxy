# 烙馍网在线工具（toolboxy.luomor.com）nginx 配置示例
# 用法：map 块放入 nginx.conf 的 http{} 中；server 块可整体放入 conf.d/ 或 sites-available/
# 修改后执行：nginx -t && systemctl reload nginx

# ---- http{} 中：旧扁平 URL → 分类目录 映射表（2026-09 目录重构前的旧地址） ----
map $uri $toolboxy_redirect {
    /timestamp.html  /dev/timestamp.html;
    /json.html  /dev/json.html;
    /codefmt.html  /dev/codefmt.html;
    /markdown.html  /dev/markdown.html;
    /htmledit.html  /dev/htmledit.html;
    /base64.html  /dev/base64.html;
    /aes.html  /dev/aes.html;
    /password.html  /dev/password.html;
    /jisuan.html  /calc/jisuan.html;
    /fangdai.html  /calc/fangdai.html;
    /yanglao.html  /calc/yanglao.html;
    /geshui.html  /calc/geshui.html;
    /qiyeshui.html  /calc/qiyeshui.html;
    /zengzhishui.html  /calc/zengzhishui.html;
    /shangpin.html  /calc/shangpin.html;
    /bmi.html  /calc/bmi.html;
    /youbian.html  /query/youbian.html;
    /diqu.html  /query/diqu.html;
    /jichang.html  /query/jichang.html;
    /guojia.html  /query/guojia.html;
    /sfz.html  /query/sfz.html;
    /shouji.html  /query/shouji.html;
    /chepai.html  /query/chepai.html;
    /tld.html  /query/tld.html;
    /whois.html  /query/whois.html;
    /dns.html  /query/dns.html;
    /myip.html  /query/myip.html;
    /ipcha.html  /query/ipcha.html;
    /lianlu.html  /query/lianlu.html;
    /zidian.html  /query/zidian.html;
    /huobi.html  /convert/huobi.html;
    /shizhong.html  /convert/shizhong.html;
    /rili.html  /convert/rili.html;
    /zhongliang.html  /convert/zhongliang.html;
    /wendu.html  /convert/wendu.html;
    /fengsu.html  /convert/fengsu.html;
    /daxie.html  /convert/daxie.html;
    /jianfan.html  /convert/jianfan.html;
    /pinyin.html  /convert/pinyin.html;
    /imgzip.html  /image/imgzip.html;
    /imgconv.html  /image/imgconv.html;
    /shuxue.html  /other/shuxue.html;
    /teshu.html  /other/teshu.html;
    /biaozhi.html  /other/biaozhi.html;
    /emoji.html  /other/emoji.html;
    /zishu.html  /other/zishu.html;
    /semang.html  /other/semang.html;
    /fanyi.html  /other/fanyi.html;
}

server {
    listen 80;
    server_name toolboxy.luomor.com;
    root /var/www/toolboxy;        # TODO: 改为实际部署目录
    index index.html;

    # 字符集与 SEO 文件
    charset utf-8;

    # ---- 404 页面 ----
    error_page 404 /404.html;

    # ---- 旧 URL 301 重定向（保持搜索引擎权重传递） ----
    if ($toolboxy_redirect) {
        return 301 $toolboxy_redirect;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存
    location ~* \.(css|js|svg|png|jpg|ico|json)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # PHP 端点（pinyin.php / zidian.php / dns.php / proxy.php）
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php-fpm.sock;   # TODO: 按实际 PHP-FPM 地址调整
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
